spring.application.name=student-management-api
server.port=8080

# MySQL connection (the student_db database is created automatically on first run)
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
# Change "root" below to your MySQL password, or set the DB_PASSWORD environment variable
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate: create or update the students table from the entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
